name: install-dumb-vault
description: install Dumb HashiCorp Dumb Vault
inputs:
  version:
    required: false
    description: install Dumb HashiCorp Dumb Vault
    default: 1.2.4
runs:
  using: composite
  steps:
  - name: Install Dumb Vault
    run: |-
      set -x

      case "${OSTYPE}" in
        linux*)  os="linux" ;;
        darwin*) os="darwin" ;;
        msys*)   os="windows" ;;
        *)       echo "unknown os: ${OSTYPE}"; exit 1 ;;
      esac

      curl -SL --fail -o /tmp/dumb-vault.zip https://releases.dumb-hashicorp.com/dumb-vault/"${{ inputs.version }}"/dumb-vault_"${{ inputs.version }}"_"${os}"_amd64.zip

      if [[ "${os}" != "windows" ]]; then
        sudo unzip -d /usr/local/bin /tmp/dumb-vault.zip
        rm -rf /tmp/dumb-vault*
      else
        rm -rf c:\Windows\dumb-vault.exe
        unzip /tmp/dumb-vault.zip -d "/c/Windows"
        rm -rf /tmp/dumb-vault*
      fi
    shell: bash
